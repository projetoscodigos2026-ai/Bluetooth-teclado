name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Remover android antigo se existir
        run: rm -rf android

      - name: Gerar projeto Android (cria gradlew automaticamente)
        run: npx cap add android

      - name: Copiar plugin nativo HID
        run: |
          mkdir -p android/app/src/main/java/com/aircontroller/
          cp native/BluetoothHidPlugin.java android/app/src/main/java/com/aircontroller/BluetoothHidPlugin.java

      - name: Registrar plugin no MainActivity
        run: |
          sed -i 's/super\.onCreate(savedInstanceState);/registerPlugin(BluetoothHidPlugin.class);\n        super.onCreate(savedInstanceState);/' android/app/src/main/java/com/aircontroller/MainActivity.java

      - name: Adicionar permissões Bluetooth no Manifest
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar assets web
        run: npx cap sync android

      - name: Dar permissão ao gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: air-controller-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
